name: 시세·뉴스 갱신

# 5분마다 자동 실행 + 수동 실행 + 코드 푸시 시 실행
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

# 데이터 JSON을 저장소에 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 비정상적으로 오래 걸리면 끊는다 — 기본값(6시간) 동안 다음 회차가 줄줄이 막히는 것 방지
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          # 앞 회차가 끝나길 기다렸다 시작해도 그 회차의 데이터 커밋(AI 하루 사용 기록 포함)부터 이어받도록
          # 예약 시점의 커밋이 아니라 지금의 최신 main을 받는다.
          ref: main

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          # 로컬 검증 환경(Node 24 LTS)과 맞춤. Node 20은 2026-04 지원 종료
          node-version: "24"

      - name: 시세·뉴스 받아 JSON 생성
        run: node scripts/fetch.mjs
        env:
          # 저장소 Secret에 GEMINI_API_KEY를 넣으면 AI 핵심뉴스 판단이 켜짐 (없으면 헤드라인 폴백)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            # 사람이 동시에 config를 수정했을 수 있으니 최신 main에 맞춰 재적용 후 푸시
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
