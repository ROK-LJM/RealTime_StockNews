name: 종목 편집 반영

# 대시보드 '✏️ 종목 편집'의 저장은 제목이 'watchlist:'인 이슈로 들어온다.
# 이 워크플로가 요청을 config/watchlist.json에 반영하고, 시세 갱신을 바로 실행한 뒤 결과를 댓글로 남기고 이슈를 닫는다.
# 공개 저장소라 누구나 이슈를 열 수 있으므로 저장소 주인이 연 이슈만 처리한다.
on:
  issues:
    types: [opened]

permissions:
  contents: write   # watchlist.json 커밋
  issues: write     # 결과 댓글·닫기
  actions: write    # 시세 갱신(update.yml) 즉시 실행

concurrency:
  group: watchlist-edit
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'watchlist:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # 이슈 본문은 환경변수로만 넘긴다(명령줄에 직접 끼워 넣으면 스크립트 주입 위험)
      - name: 요청 반영
        id: apply
        run: node scripts/watchlist-apply.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md

      - name: 커밋 & 푸시
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.json
          git commit -m "watchlist: 종목 편집 반영 (#${ISSUE_NUMBER})"
          # 5분 주기 데이터 커밋과 겹치면 최신 main에 다시 얹어 재시도(서로 다른 파일이라 충돌 없음)
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          echo "⚠️ 저장소 반영(푸시)에 실패했습니다 — 잠시 후 다시 저장해 주세요." > "$RESULT_FILE"
          exit 1
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.md

      # 봇(GITHUB_TOKEN)의 푸시는 다른 워크플로를 깨우지 않으므로 시세 갱신을 직접 실행한다(workflow_dispatch는 예외적으로 허용)
      - name: 시세 갱신 바로 실행
        if: steps.apply.outputs.changed == 'true'
        run: gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: 결과 댓글 · 이슈 닫기
        if: always()
        run: |
          [ -s "$RESULT_FILE" ] || echo "⚠️ 반영 중 오류가 났습니다 — Actions 실행 기록을 확인하세요." > "$RESULT_FILE"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RESULT_FILE"
          gh issue close "$ISSUE_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.md
