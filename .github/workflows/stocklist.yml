name: 종목 검색 목록 갱신

# '✏️ 종목 편집' 검색용 국내·미국 전체 종목 목록(docs/data/stocklist.json)을 하루 한 번 새로 만든다.
# 목록이 실제로 바뀔 때만 커밋한다. 생성 스크립트가 바뀌어 푸시되면 바로 한 번 실행한다.
on:
  schedule:
    - cron: "40 22 * * *"   # 매일 07:40 KST(국내 장 시작 전)
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "scripts/stocklist.mjs"
      - ".github/workflows/stocklist.yml"

permissions:
  contents: write

concurrency:
  group: stocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 종목 목록 생성
        run: node scripts/stocklist.mjs

      - name: 변경분 커밋 & 푸시
        run: |
          [ -f docs/data/stocklist.json ] || { echo "목록 파일 없음 — 커밋 생략"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/stocklist.json
          if git diff --staged --quiet; then echo "변경 없음 — 커밋 생략"; exit 0; fi
          git commit -m "data: 종목 검색 목록 $(date -u +%F)"
          # 5분 주기 데이터 커밋과 겹치면 최신 main에 다시 얹어 재시도(서로 다른 파일이라 충돌 없음)
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
