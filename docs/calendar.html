<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 개인 대시보드 — 검색 결과에 나오지 않게(주소를 아는 사람만 봄) -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- 스크립트는 이 사이트 것만, 외부 통신 없음(일정은 봇이 만든 data/calendar.json) — 글꼴만 jsDelivr -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f2f3f5" />
  <title>공시 일정 — 실시간 주식시장 파악</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" integrity="sha384-2nNKoOPayicGa+aRguOQuiZP+RqQ4G3jalfDeOgftkKD7zBM2gJXTwcFqCZltdv0" crossorigin="anonymous" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./calendar.css" />
  <script src="./theme.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 11 12 4.5l7.5 6.5"/><path d="M6.5 9.6V19h11V9.6"/><path d="M10.2 19v-4.6h3.6V19"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M9.7 9.6a2.4 2.4 0 0 1 4.7.7c0 1.6-2.4 2-2.4 3.5"/><path d="M12 16.9h.01"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.4 14.6A7.6 7.6 0 0 1 9.4 4.6a7.7 7.7 0 1 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v1.7M12 18.8v1.7M3.5 12h1.7M18.8 12h1.7M6 6l1.2 1.2M16.8 16.8 18 18M6 18l1.2-1.2M16.8 7.2 18 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6.5-5.5 5.5 5.5 5.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M13.5 5.5h5v5"/><path d="M18.5 5.5 11 13"/><path d="M17.5 14v3.6a1.4 1.4 0 0 1-1.4 1.4H6.4A1.4 1.4 0 0 1 5 17.6V7.9a1.4 1.4 0 0 1 1.4-1.4H10"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="./" title="대시보드로">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-bg" x=".5" y=".5" width="31" height="31" rx="8"/><path class="logo-up" d="M4.5 20.5 11 8.5l6.5 12z"/><path class="logo-down" d="M14.5 11.5h13L21 23.5z"/></svg>
        <span>공시 일정</span>
      </a>
      <div class="controls">
        <a class="icon-btn help-link" href="./" title="대시보드로" aria-label="대시보드로"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span class="help-l">대시보드</span></a>
        <button id="themeBtn" class="icon-btn" type="button" title="어두운 화면으로" aria-label="어두운 화면으로"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
        <a class="icon-btn help-link" href="./help.html#s10" title="사용설명서 (새 탭)" aria-label="사용설명서" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg><span class="help-l">설명서</span></a>
      </div>
    </div>
  </header>

  <main class="page cal-page">
    <!-- 달 넘기기 · 보기 · 거르기 — 내용은 calendar.js -->
    <section class="panel cal-head" aria-label="달력 설정">
      <div class="cal-top">
        <div class="cal-nav">
          <button id="prevM" class="icon-btn" type="button" title="이전 달" aria-label="이전 달"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
          <h1 id="monthTitle" class="cal-month">—</h1>
          <button id="nextM" class="icon-btn" type="button" title="다음 달" aria-label="다음 달"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
          <button id="todayBtn" class="btn" type="button">오늘</button>
        </div>
        <div class="seg" role="group" aria-label="보기">
          <button type="button" data-view="month" aria-pressed="true">달력</button>
          <button type="button" data-view="list" aria-pressed="false">목록</button>
        </div>
      </div>
      <div class="cal-filters">
        <div class="seg" role="group" aria-label="시장">
          <button type="button" data-mkt="all" aria-pressed="true">전체</button>
          <button type="button" data-mkt="KR" aria-pressed="false">국내</button>
          <button type="button" data-mkt="US" aria-pressed="false">해외</button>
        </div>
        <select id="stockSel" aria-label="종목"><option value="">전체 종목</option></select>
        <div class="kchips" role="group" aria-label="일정 종류">
          <button type="button" class="kchip" data-g="earn" aria-pressed="true"><i class="kdot g-earn"></i>실적</button>
          <button type="button" class="kchip" data-g="ir" aria-pressed="true"><i class="kdot g-ir"></i>IR</button>
          <button type="button" class="kchip" data-g="div" aria-pressed="true"><i class="kdot g-div"></i>배당</button>
          <button type="button" class="kchip" data-g="meet" aria-pressed="true"><i class="kdot g-meet"></i>주총·기준일</button>
          <button type="button" class="kchip" data-g="cap" aria-pressed="true"><i class="kdot g-cap"></i>자사주·증자</button>
          <button type="button" class="kchip" data-g="disc" aria-pressed="false"><i class="kdot g-disc"></i>지난 공시</button>
        </div>
      </div>
    </section>

    <div class="cal-body">
      <section id="calMain" class="panel cal-main" aria-label="달력"></section>
      <aside id="calSide" class="panel cal-side" aria-label="선택한 날과 다가오는 일정"></aside>
    </div>
    <p id="calNote" class="cal-note"></p>
  </main>
  <script src="./calendar.js"></script>
</body>
</html>
